name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version from VERSION, skip when already tagged
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - run: swift test
      - if: steps.version.outputs.new == 'true'
        run: make app
      # Developer ID signing + notarization + stapling, when the Apple secrets
      # are set (see corgi's docs/release-signing.md). macOS ties Accessibility
      # and file-access grants to the signing identity, so a signed corgi-bar
      # keeps them across updates. Without the secrets the zip is ad-hoc signed.
      - if: steps.version.outputs.new == 'true' && env.MACOS_SIGN_P12 != ''
        name: Sign with Developer ID
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$MACOS_SIGN_P12" | base64 --decode > /tmp/developer-id.p12
          security create-keychain -p ci /tmp/ci.keychain-db
          security set-keychain-settings -lut 21600 /tmp/ci.keychain-db
          security unlock-keychain -p ci /tmp/ci.keychain-db
          security import /tmp/developer-id.p12 -k /tmp/ci.keychain-db -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci /tmp/ci.keychain-db
          security list-keychains -d user -s /tmp/ci.keychain-db login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning /tmp/ci.keychain-db | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" build/corgi-bar.app
          codesign --verify --deep --strict --verbose=2 build/corgi-bar.app
      - if: steps.version.outputs.new == 'true' && env.MACOS_NOTARY_KEY != ''
        name: Notarize and staple
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY" > /tmp/AuthKey.p8
          ditto -c -k --keepParent build/corgi-bar.app /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip --key /tmp/AuthKey.p8 --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 20m
          xcrun stapler staple build/corgi-bar.app
          spctl -a -vv -t install build/corgi-bar.app
      - if: steps.version.outputs.new == 'true'
        run: ditto -c -k --keepParent build/corgi-bar.app corgi-bar.zip
      - if: steps.version.outputs.new == 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty=format:"- %s (%h)" $RANGE > RELEASE_NOTES.md
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: corgi-bar.zip
      # The Homebrew tap polls for releases every ten minutes. With a TAP_TOKEN
      # (a fine-grained PAT: homebrew-tools, Actions read and write) the cask
      # is rewritten right now instead. Never fails the release: the poll is
      # the backstop, so a missing or expired token costs ten minutes, not a
      # red build.
      - if: steps.version.outputs.new == 'true' && env.TAP_TOKEN != ''
        name: Tell the tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: gh workflow run update-corgi-bar.yml -R Andriiklymiuk/homebrew-tools
